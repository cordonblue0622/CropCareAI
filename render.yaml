services:
  - type: web
    name: cropcare-ai-backend
    runtime: python
    rootDir: ai_backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_MOCK_SERVICES
        value: "false"
      - key: REQUIRE_AUTH
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:8080,http://127.0.0.1:8080,https://crop-care-ai-olive.vercel.app,https://downloadsite-jade.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PASSWORD_RESET_REDIRECT_URL
        value: cropcareai://auth/reset-password
      - key: ADMIN_INVITE_REDIRECT_URL
        value: https://cropcareai-nxn4.onrender.com/admin
      - key: ADMIN_AUTH_REDIRECT_URL
        value: https://cropcareai-nxn4.onrender.com/admin
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna