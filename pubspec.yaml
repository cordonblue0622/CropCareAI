name: cropcare_ai
description: "CropCare AI - Precision diagnostics for a flourishing harvest."
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local Database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Supabase (remote)
  supabase_flutter: ^2.5.6

  # State Management
  provider: ^6.1.2

  # UI
  smooth_page_indicator: ^1.1.0

  # Network
  connectivity_plus: ^6.0.3

  # Storage
  shared_preferences: ^2.2.3

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  csv: ^6.0.0
  file_picker: ^8.1.2

  # Charts
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.5.4
  cached_network_image: ^3.4.1
  tflite_flutter: ^0.11.0

  # Video
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3

  # Voice
  speech_to_text: ^7.0.0
  record: ^5.2.1
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0
  confetti: ^0.7.0

  # Local Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Permissions
  permission_handler: ^11.3.1
  http: ^1.6.0
  country_picker: ^2.0.27
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3
  path_provider_platform_interface: ^2.1.2

# Force record_linux to a version compatible with record_platform_interface 1.5.0.
# Pub resolved record_linux 0.7.2 transitively, which predates startStream / the
# new hasPermission signature and breaks the Android build (Dart type-checks
# every federated plugin even on non-Linux targets).
dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
